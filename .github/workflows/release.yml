name: Release

# Se dispara al empujar un tag `vX.Y.Z`. Genera los instaladores de las 3
# plataformas (sin los ficheros de auto-update que no usamos: `latest*.yml` ni
# `*.blockmap`) y los sube a un GitHub Release en borrador.
#
# El cuerpo del release se toma de `.github/release-notes.md`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: linux-installers
          - os: macos-latest
            label: macOS
            artifact: macos-installers
          - os: windows-latest
            label: Windows
            artifact: windows-installers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar FFmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build
        run: npm run build

      - name: Empaquetar instaladores
        run: npx electron-builder
        env:
          # Primera fase sin firma: macOS (Gatekeeper) y Windows (SmartScreen)
          # mostrarán aviso.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Subir instaladores como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar los instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear/actualizar el release borrador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe; se actualizan notas y assets."
            gh release edit "$TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" --draft \
              --title "Telemetry Studio ${TAG}" \
              --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
