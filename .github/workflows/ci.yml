name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Descargar FFmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build
        run: npm run build

      - name: Smoke + E2E (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run smoke && xvfb-run -a npm run e2e
