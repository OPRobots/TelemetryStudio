appId: com.oprobots.poc4-packaging
productName: OPRobots PoC4 Packaging
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
asarUnpack:
  - "node_modules/@serialport/**"
  - "node_modules/serialport/**"
  - "**/*.node"
win:
  executableName: OPRobotsPoC4
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: robotaleh
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
