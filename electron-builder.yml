appId: org.oprobots.telemetry-studio
productName: Telemetry Studio
# @serialport/bindings-cpp es N-API y trae prebuilds por plataforma; no se debe
# reconstruir con node-gyp (en CI falla por distutils ausente / falta de VS).
npmRebuild: false
# macOS: firma ad-hoc del .app (ver scripts/after-pack-sign.cjs). Apple Silicon
# exige una firma de código válida; sin ella el DMG arm64 no arranca.
afterPack: ./scripts/after-pack-sign.cjs
directories:
  buildResources: build
files:
  - "out/**/*"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
      - "!.gitkeep"
  - from: resources/udev
    to: udev
    filter:
      - "**/*"
  # Icono también en runtime (ventana/barra de tareas), además del empaquetado.
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - "node_modules/@serialport/**"
  - "node_modules/serialport/**"
  - "node_modules/.cache/**"
  - "**/*.node"
win:
  executableName: TelemetryStudio
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # No usamos auto-update: evita generar/actualizar los .blockmap diferenciales.
  differentialPackage: false
portable:
  artifactName: ${name}-${version}-windows-portable.${ext}
mac:
  category: public.app-category.utilities
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Debe ser un mapa: electron-builder hace Object.assign(appPlist, extendInfo).
  # Con la forma de lista (`- clave: valor`) se generaban claves "0", "1"… en el Info.plist.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: robotaleh
  category: Development
appImage:
  artifactName: ${name}-${version}-linux.${ext}
deb:
  artifactName: ${name}-${version}-linux.${ext}
