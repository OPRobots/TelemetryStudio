appId: org.oprobots.telemetry-studio
productName: Telemetry Studio
directories:
  buildResources: build
files:
  - "out/**/*"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
      - "!.gitkeep"
  - from: resources/udev
    to: udev
    filter:
      - "**/*"
  # Icono también en runtime (ventana/barra de tareas), además del empaquetado.
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - "node_modules/@serialport/**"
  - "node_modules/serialport/**"
  - "node_modules/.cache/**"
  - "**/*.node"
win:
  executableName: TelemetryStudio
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.utilities
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Debe ser un mapa: electron-builder hace Object.assign(appPlist, extendInfo).
  # Con la forma de lista (`- clave: valor`) se generaban claves "0", "1"… en el Info.plist.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: robotaleh
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
# Publicación: en tags `v*` electron-builder sube los artefactos a un GitHub
# Release en borrador (ver .github/workflows/release.yml).
publish:
  provider: github
  owner: OPRObots
  repo: TelemetryStudio
  releaseType: draft
