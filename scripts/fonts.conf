<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configuración mínima de fontconfig para desarrollo.
  Evita parsear /etc/fonts/conf.d, cuyos archivos generan warnings en algunos
  sistemas (p.ej. CachyOS/Arch) sin afectar al funcionamiento de la app.
  Se usa con FONTCONFIG_FILE=scripts/fonts.conf.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir>/tmp/oprobots-fontconfig-cache</cachedir>
</fontconfig>
